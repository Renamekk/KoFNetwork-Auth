# =============================================================================
#  Velocity — конфигурация прокси KoF Network.
#
#  Файл синхронизируется в контейнер при каждом запуске, ${CFG_*} подставляются
#  из .env. Правьте здесь, а не внутри контейнера: том перезапишет изменения.
# =============================================================================

config-version = "2.8"

bind = "0.0.0.0:25565"
motd = "${CFG_MOTD}"
show-max-players = ${CFG_MAX_PLAYERS}

# Сеть работает с нелицензионными аккаунтами: проверку личности выполняет
# KoFAuth по паролю, а не Mojang. При online-mode = true пароль был бы не нужен
# и вся эта система тоже.
online-mode = false
force-key-authentication = false
prevent-client-proxy-connections = false

# modern — форвардинг Velocity: бэкенд получает настоящий UUID и IP игрока,
# подписанные секретом. Без него любой сможет подключиться к Paper напрямую
# под чужим ником.
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"
sample-players-in-ping = false
enable-player-address-logging = true

[servers]
# ---------------------------------------------------------------------
#  Limbo: limbo-1 … limbo-5
# ---------------------------------------------------------------------
#  KoFAuth рассчитан на пять подготовленных Limbo по 50 игроков каждый
#  (velocity.yml → limbo.servers и limbo.capacity-per-instance).
#
#  Здесь перечисляются только те, что действительно существуют. Имя без
#  живого сервера KoFAuth не выберет: маршрутизация проверяет и
#  регистрацию, и ответ на ping. Раньше это было не так — выключенный
#  сервер считался пригодным и, будучи пустым, выбирался первым.
#
#  Добавляя подготовленный инстанс, впишите его сюда и перезапустите
#  прокси. Создавать их этот compose не берётся: жизненный цикл ведёт
#  внешняя служба (velocity.yml → limbo.lifecycle).
limbo-1 = "limbo:25565"
# limbo-2 = "limbo-2:25565"
# limbo-3 = "limbo-3:25565"
# limbo-4 = "limbo-4:25565"
# limbo-5 = "limbo-5:25565"

# ---------------------------------------------------------------------
#  Хабы: hub-1 … hub-10
# ---------------------------------------------------------------------
#  Куда игрок попадает после входа (velocity.yml → hub.servers).
#  По умолчанию — игровой сервер из этого же compose. Если он уже есть и
#  живёт вне Docker, задайте адрес в .env:
#     LOBBY_ADDRESS=host.docker.internal:25566
#  и уберите профиль lobby из COMPOSE_PROFILES, чтобы не поднимать лишний.
#
#  Перевод перебирает хабы по загрузке: не принял один — пробуется
#  следующий. Пока перечислен один, перебирать нечего.
hub-1 = "${CFG_LOBBY_ADDRESS}"
# hub-2 = "hub-2:25565"
# hub-3 = "hub-3:25565"
# hub-4 = "hub-4:25565"
# hub-5 = "hub-5:25565"
# hub-6 = "hub-6:25565"
# hub-7 = "hub-7:25565"
# hub-8 = "hub-8:25565"
# hub-9 = "hub-9:25565"
# hub-10 = "hub-10:25565"

# try обязан указывать на Limbo. Окажись здесь хаб — игрок на мгновение
# попал бы на боевой сервер до того, как отработает маршрутизация KoFAuth.
try = ["limbo-1"]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = false
enable-reuse-port = false
command-rate-limit = 50
forward-commands-if-rate-limited = true
kick-after-rate-limited-commands = 0
tab-complete-rate-limit = 10
kick-after-rate-limited-tab-completes = 0

[query]
enabled = false
port = 25565
map = "KoF Network"
show-plugins = false
