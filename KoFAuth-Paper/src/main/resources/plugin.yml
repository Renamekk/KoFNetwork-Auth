name: KoFAuth
version: '${project.version}'
main: net.kofnetwork.auth.paper.KoFAuthPaper
api-version: '1.21'
authors: [KoF Network]
description: Система авторизации сети KoF Network
# POSTWORLD обязателен, а не «желателен»: в режиме LIMBO плагин создаёт мир
# в onEnable, а при STARTUP включение происходит ДО загрузки миров сервера —
# WorldCreator.createWorld() в этот момент вернуть мир не может, и плагин
# выключает сам себя. Проверено на Paper 1.21.8: со STARTUP Limbo не поднимается.
#
# Раньше здесь стоял STARTUP с расчётом «загрузиться раньше остальных плагинов».
# Порядок включения этого не гарантирует в принципе: чужой плагин, объявивший
# STARTUP, всё равно окажется раньше. Порядок обработчиков задаётся приоритетом
# события, и защитные слушатели стоят на EventPriority.LOWEST — именно это, а не
# фаза загрузки, и обеспечивает первенство.
load: POSTWORLD

commands:
  captcha:
    description: Ввод кода текстовой CAPTCHA
    usage: /captcha <код>
