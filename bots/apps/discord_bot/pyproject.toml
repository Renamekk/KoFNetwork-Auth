[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kofauth-discord-bot"
version = "1.0.0"
description = "Discord-бот KoF Network"
requires-python = ">=3.10"
dependencies = [
    "kofauth-common",
    "discord.py>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["discord_bot"]
