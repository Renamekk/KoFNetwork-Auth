# =============================================================================
#  KoFAuth — общие настройки
#
#  Любое значение можно переопределить переменной окружения:
#    KOFAUTH_CONFIG_<ПУТЬ>, где точки и дефисы заменены подчёркиванием.
#  Например, auth.login.timeout → KOFAUTH_CONFIG_AUTH_LOGIN_TIMEOUT
#
#  Длительности пишутся с единицей: 30s, 15m, 24h, 7d.
# =============================================================================

# Язык сообщений. Файлы локализации лежат в messages/<язык>.yml
language: ru

auth:
  registration:
    # Разрешена ли регистрация новых аккаунтов.
    # Дублируется настройкой auth.registration.enabled в таблице settings:
    # значение из базы применяется на всех узлах сети сразу и имеет приоритет.
    enabled: true

    # Максимум аккаунтов с одного IP. Защита от массовой регистрации ботов.
    # 0 — без ограничения (не рекомендуется на публичном сервере).
    max-accounts-per-ip: 3

    # За какой период считается предыдущее ограничение.
    ip-limit-window: 7d

  login:
    # Сколько времени даётся на вход, прежде чем игрока отключат.
    # Слишком короткое значение отсекает тех, кто ищет пароль в менеджере.
    timeout: 60s

    # Неудачных попыток подряд до временной блокировки аккаунта.
    max-attempts: 5

    # Длительность временной блокировки после исчерпания попыток.
    lockout-duration: 15m

    # Показывать ли игроку, сколько попыток осталось.
    # true удобнее для честного игрока и почти ничего не даёт атакующему:
    # он и так считает свои попытки.
    show-remaining-attempts: true

  session:
    # Скользящий срок жизни игровой сессии: продлевается активностью.
    ttl: 24h

    # Жёсткий потолок жизни сессии. Не двигается активностью — иначе угнанную
    # сессию можно было бы «прогревать» бесконечно.
    absolute-ttl: 7d

    # Привязывать игровую сессию к IP-адресу.
    # Для Minecraft это оправданно: адрес меняется редко.
    # Игроки с мобильным интернетом при этом будут чаще вводить пароль.
    bind-to-ip: true

    # Сколько игровых сессий может быть у аккаунта одновременно.
    max-concurrent: 1

  premium:
    # Пускать лицензионные аккаунты без пароля, доверяя проверке Mojang.
    # Работает только при включённом online-mode на прокси.
    enabled: false

# Тексты сообщений. Поддерживается MiniMessage: <red>, <bold>, <gradient:...>.
messages:
  prefix: "<gradient:#5555FF:#AA00AA><bold>KoF</bold></gradient> <dark_gray>»</dark_gray> "
  register-prompt: "<yellow>Зарегистрируйтесь: <white>/register <пароль> <пароль>"
  login-prompt: "<yellow>Войдите: <white>/login <пароль>"
  login-success: "<green>Вход выполнен. Приятной игры!"
  register-success: "<green>Аккаунт создан. Не забудьте привязать почту: <white>/email"
  wrong-password: "<red>Неверный логин или пароль."
  timeout-kick: "<red>Вы не успели войти за отведённое время."

# Ведение журнала.
logging:
  # Писать ли в лог каждый успешный вход. На крупной сети это заметный объём;
  # история всё равно сохраняется в таблицу login_history.
  log-successful-logins: false

  # Писать ли в лог неудачные попытки. Оставлять включённым: это первый признак атаки.
  log-failed-logins: true

  # Уровень подробности для отладки: false в производственной среде.
  debug: false

# Фоновое обслуживание.
maintenance:
  # Как часто чистить протухшие токены и сессии.
  cleanup-interval: 1h

  # Сколько хранить записи аудита уровня INFO. WARNING и CRITICAL не удаляются.
  audit-retention: 90d

  # Сколько хранить устройства, с которых давно не заходили.
  device-retention: 180d
