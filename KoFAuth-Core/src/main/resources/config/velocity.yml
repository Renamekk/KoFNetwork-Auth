# =============================================================================
#  KoFAuth — настройки прокси Velocity
# =============================================================================

limbo:
  # Имена Limbo-серверов из velocity.toml. Неаутентифицированный игрок
  # попадает только сюда.
  servers:
    - limbo-1

  # Как выбирать Limbo при нескольких: least-players | random | first-available
  strategy: least-players

  # Что делать, если ни один Limbo не доступен: kick | allow-lobby
  # kick — единственный безопасный вариант: allow-lobby пропустит
  # неаутентифицированного игрока на боевой сервер.
  on-unavailable: kick

lobby:
  # Куда переводить игрока после успешного входа.
  servers:
    - lobby-1
  strategy: least-players

restrictions:
  # Что запрещено до аутентификации.

  # Команды, разрешённые в Limbo. Всё остальное блокируется.
  allowed-commands:
    - login
    - register
    - l
    - reg

  # Блокировать чат до входа. Отключать нельзя: иначе игрок,
  # перепутавший /login с текстом, отправит пароль в общий чат.
  block-chat: true

  # Блокировать переключение серверов командой /server.
  block-server-switch: true

  # Разрывать соединение при попытке выполнить запрещённую команду.
  # false — просто игнорировать с сообщением.
  kick-on-forbidden-command: false

# Тексты киков переехали в messages.yml, секция kick. Там же остальные строки,
# которые видит игрок: держать их в двух файлах — значит искать в двух местах.

forwarding:
  # Заголовок, из которого брать реальный IP, если перед Velocity стоит
  # обратный прокси или защита от DDoS.
  # ВАЖНО: доверять заголовку можно ТОЛЬКО когда прокси действительно есть.
  # Иначе клиент подставит любой адрес и обойдёт все ограничения по IP.
  trust-proxy-header: false
  header-name: "X-Real-IP"

  # Адреса, от которых принимается заголовок. Пусто при trust-proxy-header: true
  # означает «доверять всем» — так делать нельзя.
  trusted-proxies:
    - 127.0.0.1

heartbeat:
  # Как часто прокси сообщает о себе в таблицу servers.
  interval: 10s
