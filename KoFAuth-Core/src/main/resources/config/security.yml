# =============================================================================
#  KoFAuth — безопасность
#
#  ВАЖНО: encryption.key и jwt.secret в производственной среде задаются
#  переменными окружения, а не этим файлом:
#    KOFAUTH_SECURITY_ENCRYPTION_KEY
#    KOFAUTH_SECURITY_JWT_SECRET
#
#  Потеря encryption.key делает нечитаемыми секреты TOTP и токены Discord —
#  храните его вместе с резервной копией базы.
# =============================================================================

password:
  # Стоимость BCrypt: 2^cost итераций. Допустимо 10..16.
  #   12 — примерно 100–250 мс на проверку. Ниже 10 — перебор украденной базы дёшев.
  #   Выше 13 при высокой нагрузке превращает вход в отказ в обслуживании:
  #   при 40 логинах/сек и 400 мс на проверку нужно 16 полностью занятых ядер.
  bcrypt-cost: 12

  policy:
    min-length: 8

    # Верхний предел. BCrypt учитывает только первые 72 БАЙТА, а кириллица
    # занимает два байта на символ, поэтому 40 русских букв — уже 80 байт.
    # Пароли сверх предела отвергаются, а не обрезаются молча.
    max-length: 64

    require-uppercase: true
    require-lowercase: true
    require-digit: true

    # Обязательный спецсимвол даёт небольшой прирост стойкости, но заметно
    # увеличивает долю забытых паролей, а каждое восстановление — ещё один
    # путь к захвату аккаунта.
    require-special: false

    # Запретить пароль, содержащий ник.
    forbid-username: true

    # Запретить пароли из списка самых частых.
    forbid-common: true

    # Запретить aaaa, 12345, qwerty и подобное.
    forbid-sequences: true

encryption:
  # Ключ AES-256 в Base64, ровно 32 байта.
  # Сгенерировать: openssl rand -base64 32
  key: ""

two-factor:
  # Длина кода подтверждения входа через Telegram и Discord.
  #
  # Код либо нажимается кнопкой, либо вводится руками после /sendcode, поэтому
  # он читаемый, а не 64 знака hex. Верхняя граница жёсткая: код едет в
  # callback_data кнопки Telegram, а туда помещается 64 байта вместе с префиксом.
  # 10 знаков дают около 50 бит — при сроке жизни в 2 минуты и уже проверенном
  # пароле этого достаточно. Меньше 6 не примет генератор.
  approval-code-length: 10

jwt:
  # Секрет подписи, не короче 32 байт.
  # Сгенерировать: openssl rand -hex 32
  secret: ""

  # Срок жизни access-токена. Больше часа не допускается: JWT нельзя отозвать,
  # и длинный срок означает, что «выйти со всех устройств» не работает.
  access-lifetime: 15m

  # Срок жизни refresh-токена. Он хранится в базе и отзывается мгновенно.
  refresh-lifetime: 30d

rate-limit:
  enabled: true

  # Формат: <число попыток> за <окно>.
  # Окно скользящее: при фиксированном лимит «10 в минуту» позволял бы
  # сделать 20 запросов подряд на стыке двух минут.
  login:
    per-ip:
      attempts: 10
      window: 1m
    per-account:
      attempts: 5
      window: 5m

  register:
    per-ip:
      attempts: 3
      window: 10m

  password-reset:
    per-account:
      attempts: 3
      window: 1h

  totp:
    per-account:
      attempts: 5
      window: 5m

  # Ограничения для REST API.
  api:
    per-ip:
      attempts: 120
      window: 1m

antibot:
  enabled: true

  # Одновременных подключений с одного IP.
  max-connections-per-ip: 3

  # Подключений с одной подсети (/24 для IPv4, /64 для IPv6) за окно.
  # Ботнет обычно распоряжается подсетью, а не одиночным адресом.
  max-connections-per-subnet: 10
  subnet-window: 1m

  # Порог, за которым сеть считается атакуемой и CAPTCHA включается всем.
  join-rate-threshold: 30
  join-rate-window: 10s

antivpn:
  # Проверка VPN, прокси и диапазонов хостинга.
  # Выключено по умолчанию: провайдер требует ключа, а ложные срабатывания
  # закрывают вход честным игрокам через мобильный интернет.
  enabled: false

  # Провайдер репутации: proxycheck | ipqualityscore | none
  provider: none
  api-key: ""

  # Что блокировать при срабатывании.
  block-proxy: true
  block-hosting: true
  block-malicious: true

  # Поведение при недоступности внешней службы: allow | deny
  # allow — отказ стороннего сервиса не должен закрывать вход всей сети.
  on-failure: allow

session:
  # Отзывать сессию при смене IP-адреса.
  revoke-on-ip-change: true

  # Требовать второй фактор при входе с незнакомого устройства,
  # даже если 2FA настроена как необязательная.
  require-2fa-on-new-device: true

  # Уведомлять владельца о входе с нового устройства или из новой страны.
  notify-on-new-device: true
  notify-on-new-country: true
