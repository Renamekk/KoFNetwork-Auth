# =============================================================================
#  KoFAuth — настройки сервера Paper
# =============================================================================

# Роль этого сервера:
#   LIMBO   — сюда попадает игрок до входа: заморозка, защита, CAPTCHA, команды
#   BACKEND — обычный игровой сервер: только проверка сессии и админ-команды
mode: BACKEND

limbo:
  # Мир Limbo. Создаётся автоматически, если отсутствует.
  world-name: kofauth_limbo

  # Точка появления.
  spawn:
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
    # Радиус площадки из барьеров под точкой появления. Мир пустой, и без
    # площадки игрок падает в пустоту.
    # 0 — один блок под ногами, -1 — не класть площадку вовсе.
    platform-radius: 3

  # Защита. Каждый пункт отключает одну возможность взаимодействия с миром.
  protection:
    # Ломать и ставить блоки.
    block-break: true
    block-place: true
    # Получать любой урон, включая падение и пустоту.
    damage: true
    # Голод.
    hunger: true
    # Подбирать и выбрасывать предметы.
    item-pickup: true
    item-drop: true
    # Открывать сундуки, нажимать кнопки, взаимодействовать с сущностями.
    interact: true
    # Перемещаться. Полная блокировка раздражает; ограничиваем радиусом.
    movement: false
    movement-radius: 5.0
    # Видеть других игроков. Скрытие мешает подглядеть, кто вводит пароль,
    # и заодно снимает нагрузку с клиента при массовом заходе ботов.
    hide-players: true
    # Команды, кроме разрешённых.
    commands: true

  # Внешний вид.
  effects:
    # Слепота до входа. Действенно против ботов с автоматическим обзором,
    # но неприятно для людей — по умолчанию выключено.
    blindness: false
    # Фиксировать время суток в мире Limbo.
    fixed-time: 6000
    # Отключить погоду.
    disable-weather: true

  # Периодическое напоминание о необходимости войти.
  reminder:
    enabled: true
    interval: 10s
    # Показывать обратный отсчёт до отключения.
    show-countdown: true

  # Надпись на экране, пока игрок не прошёл вход.
  #
  # Титул исчезает сам через stay-тиков, поэтому он не выставляется один раз,
  # а переотправляется. Период refresh должен быть меньше stay: иначе между
  # отправками остаётся щель, в которой надпись мигает.
  title:
    enabled: true
    # Сам текст — в messages.yml: limbo-title и limbo-subtitle-*.
    # Здесь только тайминги: правка формулировки не должна требовать
    # разбираться в тиках, и наоборот.
    # Плавное появление только при первой отправке; далее надпись висит ровно.
    fade-in: 250ms
    stay: 5s
    fade-out: 250ms
    refresh: 2s

    # Мягкий перелив цветов. Первая буква KoF всегда остаётся красной,
    # последняя — золотой, а Network всегда заканчивается белым. Состояние
    # входа продолжает опрашиваться с периодом refresh, поэтому частота кадров
    # не создаёт дополнительные запросы к Redis.
    animation:
      enabled: true
      interval: 150ms

backend:
  # Проверять сессию при входе на игровой сервер.
  # Защита от прямого подключения в обход прокси.
  verify-session: true

  # Что делать, если сессия не подтверждена: kick | send-to-limbo
  on-invalid-session: kick

gui:
  # Звук при открытии GUI CAPTCHA. Пусто — без звука.
  open-sound: "BLOCK_NOTE_BLOCK_PLING"
  success-sound: "ENTITY_PLAYER_LEVELUP"
  failure-sound: "ENTITY_VILLAGER_NO"

heartbeat:
  interval: 10s

# =============================================================================
#  Операторы сервера
# =============================================================================
#
#  Игрок с OP на игровом сервере считается администратором KoFAuth и получает
#  все права /auth без исключений — включая те, которых нет ни у одной роли.
#
#  Зачем эта передача вообще нужна. OP — понятие Bukkit: он лежит в ops.json
#  игрового сервера. Velocity собственной системы прав не имеет и без стороннего
#  плагина отвечает UNDEFINED на любой запрос, а файла соседнего процесса
#  (нередко и соседней машины) не видит. Признак переносится через общее
#  хранилище состояния — единственное, что у прокси и бэкенда есть общего.
#
#  ВАЖНО: работает только при включённом Redis (database.yml -> redis.enabled).
#  С локальным кэшем у каждого процесса своя память, и прокси отметку не увидит;
#  там администраторов задаёт velocity.yml -> admin.operators.
operators:
  # Передавать признак OP на прокси.
  #
  # false отключает подъём прав по OP целиком: /auth останется доступен только
  # по ролям KoFAuth и по правам стороннего плагина. Так стоит делать там, где
  # OP выдан не только тем, кому доверено управление аккаунтами сети.
  publish: true

  # Как часто обновлять отметку. Её срок жизни вчетверо больше периода, поэтому
  # выключенный бэкенд перестаёт наделять правами сам собой, а снятый /deop
  # перестаёт действовать в пределах нескольких минут.
  refresh: 1m

# =============================================================================
#  Поведение при отказе аутентификации
# =============================================================================
#
#  Игровой сервер, оставшийся работать без проверки сессий, — это прямой вход
#  под любым ником в обход прокси. Раньше при отказе запуска плагин просто
#  выключался, а сервер продолжал принимать игроков; выключенный плагин защиты
#  не защищает.
fail-closed:
  # Останавливать сервер, если аутентификация недоступна.
  #
  # false оставит сервер поднятым, но в блокировке: новые подключения
  # отвергаются, уже подключённые отключаются. Так стоит делать только там,
  # где рядом есть внешний надзор, который увидит отказ и вмешается.
  shutdown: true

  # Следить за готовностью и после запуска. Отказ базы или хранилища состояния
  # в работе ничем не лучше отказа при старте.
  watch-readiness: true
  check-interval: 15s

  # Сколько проверок подряд должно не пройти. Порог нужен, чтобы секундная
  # сетевая помеха не роняла сервер, на котором играют люди.
  failures-before-lockdown: 4
