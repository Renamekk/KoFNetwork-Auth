# =============================================================================
#  KoFAuth — тексты, которые видит игрок
# =============================================================================
#
#  Здесь собраны ВСЕ обращённые к игроку строки: чат, кики, надписи на экране.
#  Настройки поведения — в других файлах; сюда вынесен только текст, чтобы
#  менять формулировки можно было, не разбираясь в остальном.
#
#  Разметка — MiniMessage: <red>, <bold>, <gradient:#a:#b>, <click:...>.
#  Коды вида §a тоже работают, но устарели и не поддерживают градиенты.
#
#  Подстановки записываются угловыми скобками и перечислены в комментарии
#  к каждой строке, где они есть. Неизвестная подстановка останется в тексте
#  как есть — это видно сразу и не роняет сервер.
#
#  Применяется командой /auth reload без перезапуска сети.
# =============================================================================

# =============================================================================
#  Фирменные цвета KoF Network
# =============================================================================
#
#  KoF     — красный, переливающийся в золото: <gradient:#FF2D2D:#FFD700>
#  Network — белый
#  KoFNetwork одним словом — красный → золотой → белый:
#            <gradient:#FF2D2D:#FFD700:#FFFFFF>
#
#  Градиент MiniMessage распределяет цвета по буквам, поэтому он осмыслен только
#  на словах длиной хотя бы в три буквы: на «KoF» это ровно три ступени, и
#  переход виден. Разбивать бренд на два тега (KoF отдельно, Network отдельно)
#  обязательно — один общий градиент на всю надпись увёл бы «Network» в золото,
#  а он должен оставаться белым.
#
#  Собрать свой вариант: https://minetools.in/color-text-generator

# Префикс подставляется ко всем сообщениям в чате.
# Кики и надписи на экране идут без него: там префикс только отнимает место.
prefix: "<gradient:#FF2D2D:#FFD700><bold>KoF</bold></gradient><white><bold>Network</bold></white> <dark_gray>»</dark_gray> "

# --------------------------------------------------------------------- общее
error: "<red>Внутренняя ошибка. Попробуйте позже."
account-not-found: "<red>Аккаунт не найден."
not-authenticated-command: "<red>Сначала войдите в аккаунт."
rate-limited: "<red>Слишком много попыток. Подождите <white><minutes> мин."
lobby-unavailable: "<red>Лобби недоступно. Сообщите администрации."

# --------------------------------------------------------------------- вход
login-prompt: "<yellow>Войдите: <white>/login <пароль>"
login-usage: "<yellow>Использование: <white>/login <пароль> [код]"
login-success: "<green>Вход выполнен. Приятной игры!"
already-logged-in: "<yellow>Вы уже вошли."

# <attempts> — сколько попыток осталось.
wrong-password: "<red>Неверный логин или пароль."
wrong-password-attempts: "<red>Неверный логин или пароль. Осталось попыток: <white><attempts>"

# <method> — TOTP, TELEGRAM или DISCORD.
two-factor-required: "<yellow>Требуется подтверждение: <white><method>"
two-factor-failed: "<red>Неверный код подтверждения."

# --------------------------------------------------------------- регистрация
register-prompt: "<yellow>Зарегистрируйтесь: <white>/register <пароль> <пароль>"
register-usage: "<yellow>Использование: <white>/register <пароль> <пароль>"
register-success: "<green>Аккаунт создан. Не забудьте привязать почту: <white>/email"
already-registered: "<yellow>Аккаунт уже существует. Войдите: <white>/login <пароль>"
username-taken: "<red>Этот ник уже занят."
invalid-username: "<red>Ник содержит недопустимые символы или зарезервирован."
passwords-mismatch: "<red>Пароли не совпадают."
password-too-weak: "<red>Пароль слишком простой:"
registration-disabled: "<red>Регистрация временно закрыта."
ip-limit: "<red>С вашего адреса зарегистрировано слишком много аккаунтов."

# --------------------------------------------------------------------- CAPTCHA
captcha-required: "<yellow>Подтвердите, что вы не бот."
captcha-passed: "<green>Проверка пройдена."
# <attempts> — сколько попыток осталось.
captcha-wrong: "<red>Неверно. Осталось попыток: <white><attempts>"
captcha-exhausted: "<yellow>Попытки исчерпаны. Выдана новая проверка."
captcha-none-active: "<yellow>У вас нет активной проверки."
captcha-usage: "<yellow>Использование: <white>/captcha <код>"

# ------------------------------------------------------------ привязка сайта
web-link-usage: "<yellow>Использование: <white>/link <код с сайта>"
web-link-success: "<green>Сайт привязан к вашему аккаунту. Вкладка в браузере войдёт сама."
# <reason> — причина отказа понятным текстом.
web-link-failed: "<red><reason>"

# --------------------------------------------------------- надпись в Limbo
#
# Показывается, пока игрок не вошёл. Сроки показа — в paper.yml,
# limbo.title: текст и тайминги разделены намеренно, чтобы правка формулировки
# не требовала думать о тиках.
#
# Заголовок висит всё время ожидания; подзаголовок меняется по шагу входа.
limbo-title: "<gradient:#FF2D2D:#FFD700:#FFFFFF><bold>KoFNetwork</bold></gradient>"
limbo-subtitle-captcha: "<yellow>Подтвердите, что вы не бот"
limbo-subtitle-login: "<yellow>Войдите: <white>/login <пароль>"
limbo-subtitle-register: "<yellow>Зарегистрируйтесь: <white>/register <пароль> <пароль>"

# ------------------------------------------------------- надпись после входа
#
# Показывается один раз, когда вход состоялся, — до перевода на хаб. Та же
# надпись, что и в Limbo: игрок видит бренд и в момент ожидания, и в момент,
# когда его пустили. Сроки показа — в velocity.yml, welcome.title.
#
# Выключается там же: welcome.enabled: false.
#
# <player> — ник вошедшего.
welcome-title: "<gradient:#FF2D2D:#FFD700:#FFFFFF><bold>KoFNetwork</bold></gradient>"
welcome-subtitle: "<gray>С возвращением, <white><player></white>!"

# --------------------------------------------------------------------- кики
#
# Сообщение при отключении. Префикс не подставляется: экран отключения
# и так принадлежит только этому тексту.
kick:
  not-authenticated: "<red>Вы не прошли аутентификацию."
  limbo-unavailable: "<red>Сервер авторизации недоступен. Попробуйте позже."
  antibot: "<red>Слишком много подключений с вашего адреса."
  proxy-detected: "<red>Вход через VPN или прокси запрещён."
  session-revoked: "<yellow>Ваша сессия завершена. Войдите заново."
  password-changed: "<yellow>Пароль изменён. Войдите заново."
  account-locked: "<red>Аккаунт заблокирован администрацией."
  account-banned: "<red>Аккаунт заблокирован."
  captcha-failed: "<red>Проверка не пройдена."
  timeout: "<red>Вы не успели войти за отведённое время."
