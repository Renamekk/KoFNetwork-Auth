# =============================================================================
#  KoFAuth — CAPTCHA
# =============================================================================

enabled: true

# Когда требовать прохождение:
#   first-join        — при первом входе игрока
#   every-register    — при каждой регистрации
#   suspicious        — при подозрительной активности
#   under-attack      — когда AntiBot зафиксировал всплеск подключений
require-on:
  first-join: true
  every-register: true
  suspicious: true
  under-attack: true

# Тип по умолчанию:
#   BLOCK_SELECT — выбрать в GUI названный предмет
#   TEXT_INPUT   — ввести показанный текст (самый слабый: текст уходит клиенту строкой)
#   BUTTON_CLICK — нажать нужную кнопку
#   GUI_GRID     — найти в сетке ячейку по условию (разумный баланс)
#   MAP_IMAGE    — распознать код на карте с шумом (самый стойкий и самый дорогой)
type: GUI_GRID

# Автоматически повышать сложность, если с адреса уже были провалы.
escalate-on-failure: true

# Тип, на который переключаемся при атаке или после провалов.
escalated-type: MAP_IMAGE

# Срок жизни задачи.
ttl: 2m

# Попыток на одну задачу.
max-attempts: 3

# Что делать при исчерпании попыток: kick | new-challenge
on-failure: kick

gui:
  # Заголовок окна.
  #
  # Название сети стоит здесь не для украшения: открытое окно инвентаря
  # закрывает собой игровой HUD, а вместе с ним и титул из limbo.title.
  # Пока идёт CAPTCHA, заголовок окна — единственная надпись, которую видно.
  title: "<dark_gray>KoF Network <gray>— подтвердите, что вы не бот"
  # Размер сетки для GUI_GRID: 3 (9 ячеек), 4 (16), 5 (25).
  # Больше — сложнее для бота, но и дольше для человека.
  grid-size: 4
  rows: 3

web:
  # Число вариантов в задаче с кнопками для личного кабинета.
  # Меньше четырёх — угадывается чаще чем в четверти случаев.
  buttons: 6

text:
  # Длина кода для TEXT_INPUT.
  length: 6
  # Символы, из которых собирается код. Похожие (0/O, 1/I/l) исключены.
  alphabet: "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"

map:
  # Параметры искажения для MAP_IMAGE.
  noise-level: 0.35
  distortion: true
  code-length: 5
