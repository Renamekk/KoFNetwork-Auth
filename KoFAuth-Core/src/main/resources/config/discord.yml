# =============================================================================
#  KoFAuth — Discord-бот
#
#  Секреты задавайте переменными окружения:
#    KOFAUTH_DISCORD_BOT_TOKEN
#    KOFAUTH_DISCORD_OAUTH_CLIENT_SECRET
# =============================================================================

enabled: false

bot:
  token: ""
  # Сервер, на котором регистрируются slash-команды.
  # Пусто — регистрировать глобально (обновление занимает до часа против
  # мгновенного на конкретном сервере).
  guild-id: ""

oauth:
  # OAuth2 нужен только для привязки с сайта. Привязка через бота работает без него.
  enabled: false
  client-id: ""
  client-secret: ""
  redirect-uri: "https://kofnetwork.net/api/discord/callback"
  # identify достаточно для получения идентификатора и ника.
  # email запрашивать не следует: он нам не нужен, а согласие пользователя усложняет.
  scopes:
    - identify

link:
  code-ttl: 15m
  code-length: 8

  # Дублировать выданный в игре код в канал привязки (account-channel-id).
  #
  # ВЫКЛЮЧЕНО НЕ СЛУЧАЙНО. Код предъявительский: кто первым отправит его боту,
  # тот и получит привязку — личность отправителя код никак не удостоверяет.
  # Опубликованный в канале, доступном посторонним, он означает, что аккаунт
  # игрока достанется тому, кто быстрее прочитал сообщение.
  #
  # Включать имеет смысл только для канала, куда посторонним хода нет:
  # приватного, с правом чтения у одной роли, либо на время разбирательства.
  post-code-to-channel: false

# Канал привязки аккаунта — тот, куда игрок приходит по ссылке из игры и где
# отправляет боту /link. Ссылка на него показывается в игре вместо голого кода:
# перейти по ней проще, чем искать канал руками.
#
# Идентификатор канала: включите режим разработчика в Discord,
# правой кнопкой по каналу -> «Копировать ID».
account-channel-id: ""

# Приглашение на сервер — запасная ссылка для тех, кто ещё не состоит в нём.
# Показывается в игре, если не задан account-channel-id.
invite-url: ""

login-approval:
  enabled: true
  timeout: 2m
  show-location: true

notifications:
  new-login: true
  new-device: true
  password-changed: true
  binding-changed: true
  suspicious-activity: true
  account-locked: true

roles:
  # Выдавать роль Discord после привязки аккаунта.
  grant-on-link: false
  linked-role-id: ""

# Канал для уведомлений администраторов об инцидентах.
admin-channel-id: ""
