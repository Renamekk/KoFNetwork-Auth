# =============================================================================
#  KoFAuth — Telegram-бот
#
#  Токен задавайте переменной KOFAUTH_TELEGRAM_BOT_TOKEN.
#  Токен в этом файле — прямой доступ к боту: кто его получил, тот может
#  подтверждать входы от имени любого привязанного игрока.
# =============================================================================

enabled: false

bot:
  token: ""
  username: "KoFNetworkAuthBot"

link:
  # Срок жизни кода привязки. Код выдаётся В ИГРЕ и вводится боту —
  # только так можно доказать владение игровым аккаунтом.
  code-ttl: 15m
  code-length: 8

login-approval:
  # Разрешить подтверждение входа нажатием кнопки в чате.
  enabled: true
  # Сколько игрок ждёт подтверждения, находясь в Limbo.
  timeout: 2m
  # Показывать ли в запросе город по геолокации. Помогает опознать чужой вход,
  # но раскрывает местоположение тому, кто получил доступ к Telegram игрока.
  show-location: true

notifications:
  new-login: true
  new-device: true
  password-changed: true
  binding-changed: true
  suspicious-activity: true
  account-locked: true

# Идентификаторы администраторов: получают уведомления об инцидентах по всей сети.
admin-chat-ids: []

# Ограничение частоты ответов бота. Telegram Bot API разрывает соединение
# при превышении примерно 30 сообщений в секунду.
rate-limit:
  messages-per-second: 20
