# =============================================================================
#  KoFAuth — хранилище
#
#  Пароли НЕ следует держать в этом файле в производственной среде.
#  Задайте их переменными окружения:
#    KOFAUTH_DATABASE_MYSQL_PASSWORD
#    KOFAUTH_DATABASE_REDIS_PASSWORD
#  Значение из окружения имеет приоритет над указанным здесь.
# =============================================================================

mysql:
  host: localhost
  port: 3306
  database: kofauth
  username: kofauth
  password: ""

  # Параметры JDBC-строки.
  #   connectionTimeZone=UTC + preserveInstants=true — обязательны: без них драйвер
  #   применяет к DATETIME локальный пояс приложения, и время входа «уезжает»
  #   на серверах в разных зонах.
  #   rewriteBatchedStatements=true ускоряет пакетную запись аудита в разы.
  properties:
    useSSL: false
    allowPublicKeyRetrieval: true
    connectionTimeZone: UTC
    preserveInstants: true
    rewriteBatchedStatements: true
    cachePrepStmts: true
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048

  pool:
    # Размер пула. Ориентир: (число ядер × 2) + число дисков.
    # Больше — не быстрее: соединения начинают конкурировать за те же ресурсы MySQL.
    maximum-size: 10

    # Сколько соединений держать открытыми при простое.
    minimum-idle: 2

    # Сколько ждать свободное соединение, прежде чем признать запрос неуспешным.
    connection-timeout: 10s

    # Через сколько простаивающее соединение закрывается.
    idle-timeout: 10m

    # Максимальное время жизни соединения. Должно быть заметно меньше wait_timeout
    # на стороне MySQL, иначе пул будет выдавать уже закрытые сервером соединения.
    max-lifetime: 30m

    # Предупреждать в лог, если соединение не возвращено в пул дольше этого срока.
    # Почти всегда означает утечку: забытый close() в новом коде.
    leak-detection-threshold: 30s

  # Применять миграции Flyway при старте.
  # Отключать только если схемой управляет отдельный конвейер развёртывания.
  migrate-on-startup: true

redis:
  # Redis не обязателен. Без него KoFAuth работает, но:
  #   — сессии перестают быть общими между прокси;
  #   — события не доставляются между процессами (смена пароля на сайте
  #     не разорвёт игровую сессию);
  #   — растёт нагрузка на MySQL.
  # На сети из одного прокси и одного сервера отключить допустимо.
  enabled: true

  host: localhost
  port: 6379
  password: ""
  database: 0

  # Префикс ключей. Позволяет обслуживать несколько окружений одним Redis.
  key-prefix: "kofauth:"

  timeout: 3s

  pool:
    max-total: 16
    max-idle: 8
    min-idle: 2

cache:
  # Локальный кэш перед Redis. Снимает повторные обращения по сети
  # за одним и тем же аккаунтом в пределах одного тика.
  local:
    enabled: true
    maximum-size: 10000
    ttl: 30s

  # Срок жизни записи аккаунта в Redis.
  account-ttl: 5m

  # Срок жизни вердикта о репутации IP. Внешние службы ограничивают частоту
  # запросов, поэтому значение намеренно большое.
  ip-reputation-ttl: 12h
